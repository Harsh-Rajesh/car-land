<style>

.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.packs .card{margin:0}details{margin-top:6px;font-size:.85rem}summary{cursor:pointer;color:var(--acc);font-weight:700}

.badge .bar{height:6px;background:var(--bd);border-radius:4px;overflow:hidden;width:90px;margin:3px 0}.badge .bar i{display:block;height:100%;background:var(--b)}.badge small{font-size:.65rem;color:var(--mut)}

.cr{vertical-align:-.25em}.car .cg{position:absolute;top:5px;left:6px;line-height:0}
.r4c{filter:drop-shadow(0 0 4px #ff9f1a)}.r5c{animation:chroma 3s linear infinite}.r6c{filter:drop-shadow(0 0 5px #ffd700)}.r7c{filter:drop-shadow(0 0 7px #b46bff)}
.big{max-width:240px;margin:12px auto;padding:20px}.big .e{font-size:5rem}
.pop{animation:pop .5s}@keyframes pop{from{transform:scale(.2) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}
.row{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;padding:3px 0}
.c{text-align:center}
.ic{background:none;padding:0 3px;font-size:1rem;opacity:.35;color:inherit}.ic.on{opacity:1;filter:drop-shadow(0 0 4px #b46bff)}

.r8::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#fff7,transparent);transform:skewX(-20deg);animation:shine 2.5s ease-in-out infinite;pointer-events:none}
.r8.pop{animation:pop .5s,chroma 2.5s linear infinite}
.bellb{position:relative;background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:6px 12px;color:var(--tx);font-size:1rem}
#bcnt{position:absolute;top:-7px;right:-6px;background:#e84a5f;color:#fff;border-radius:10px;font-size:.7rem;padding:1px 6px;display:none;font-weight:700}
.ring{animation:ring .8s}@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(18deg)}30%{transform:rotate(-16deg)}45%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}75%{transform:rotate(4deg)}}
.tst{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--card);color:var(--tx);border:2px solid var(--acc);border-radius:14px;padding:10px 16px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:50;max-width:90vw;text-align:center}.tst.show{opacity:1;transform:translate(-50%,0)}
/* animations */
.car{overflow:hidden;transition:transform .2s}.car:hover{transform:translateY(-4px) scale(1.04)}
.car .e svg{animation:bob 3s ease-in-out infinite}
.grid .car:nth-child(3n) .e svg{animation-delay:-.8s}.grid .car:nth-child(3n+1) .e svg{animation-delay:-1.6s}
.wh{transform-box:fill-box;transform-origin:center;animation:spin .1s linear infinite}.car:hover .wh{animation-duration:.04s}
.sp{transform-box:fill-box;transform-origin:center;animation:twinkle 2s ease-in-out infinite}
.r3c{animation:pulse 2.4s ease-in-out infinite}.r4c{animation:pulse 2s ease-in-out infinite}.r6c{animation:pulse 1.6s ease-in-out infinite}.r7c{animation:pulse 1.2s ease-in-out infinite}
.r3::after,.r4::after,.r5::after,.r6::after,.r7::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#fff6,transparent);transform:skewX(-20deg);animation:shine 3.5s ease-in-out infinite;pointer-events:none}
.r7{background-size:200% 200%;animation:aura 5s ease-in-out infinite}
.r5.pop{animation:pop .5s,chroma 3s linear infinite}.r7.pop{animation:pop .5s,aura 5s ease-in-out infinite}
.lock *,.lock::after{animation:none!important}.lock::after{display:none}.lock:hover{transform:none}
.shake{animation:shake .6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes spin{to{transform:rotate(360deg)}}

 const lp=ac.createBiquadFilter();lp.type="lowpass";lp.frequency.value=500;lp.Q.value=1.1;const eg=ac.createGain();eg.gain.value=0;
 const o1=ac.createOscillator(),o2=ac.createOscillator(),o3=ac.createOscillator(),g2=ac.createGain(),g3=ac.createGain();
 o1.type=ev?"sine":"sawtooth";o2.type=ev?"sine":"square";o3.type="triangle";g2.gain.value=ev?.25:.4;g3.gain.value=ev?.5:.7;
 o1.connect(lp);o2.connect(g2);g2.connect(lp);o3.connect(g3);g3.connect(lp);lp.connect(eg);eg.connect(master);
 const nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
 const mk=(ft,fq,Q)=>{const s=ac.createBufferSource();s.buffer=nb;s.loop=true;const f=ac.createBiquadFilter();f.type=ft;f.frequency.value=fq;f.Q.value=Q;const g=ac.createGain();g.gain.value=0;s.connect(f);f.connect(g);g.connect(master);s.start();return{f,g}};
 const tyre=mk("bandpass",1700,3.5),wind=mk("lowpass",700,.7),road=mk("lowpass",220,.8);
 o1.start();o2.start();o3.start();
 const E={ac,master,o1,o2,o3,lp,eg,tyre,wind,road,nb,ev,pm,gear:0,shiftT:0,mute:false,hitT:0};D.eng=E;
 const vc=()=>{if(D.eng!==E||ac.state==="closed"){document.removeEventListener("visibilitychange",vc);return}try{document.hidden?ac.suspend():ac.resume()}catch(e){}};document.addEventListener("visibilitychange",vc)}catch(e){D.eng=null}}
function engineUpdate(D,dt,vf,top,thr,brk,walk,slip,nit){const E=D.eng;if(!E||E.ac.state==="closed")return;const ac=E.ac,t=ac.currentTime,sp=Math.min(1,Math.abs(vf)/(top||1)),on=(!E.mute&&!walk)?1:0;
 const gp=sp*5,gear=Math.min(4,Math.floor(gp)),fr=gp-gear;if(gear!==E.gear){E.shiftT=.16;E.gear=gear}E.shiftT=Math.max(0,E.shiftT-dt);
 let rpm=.22+fr*.78+(thr?.08:0);if(sp<.02)rpm=.2+(thr?.3:0);
 const f0=E.ev?210+sp*1500:(42+rpm*125*E.pm)*(nit?1.12:1);
 E.o1.frequency.setTargetAtTime(f0,t,.05);E.o2.frequency.setTargetAtTime(E.ev?f0*2:f0*1.5,t,.05);E.o3.frequency.setTargetAtTime(f0*2,t,.05);
 const vol=E.ev?.05+sp*.07:.055+(thr?.06:0)+rpm*.05;E.eg.gain.setTargetAtTime(on*vol*(E.shiftT>0?.35:1),t,.04);
 E.lp.frequency.setTargetAtTime(E.ev?3000:350+rpm*1900+(thr?700:0),t,.06);
 E.tyre.g.gain.setTargetAtTime(on*slip*.12,t,.04);E.tyre.f.frequency.setTargetAtTime(1300+sp*900+slip*500,t,.1);
 E.wind.g.gain.setTargetAtTime(on*(sp*sp*.07+(nit?.05:0)),t,.1);E.wind.f.frequency.setTargetAtTime(400+sp*1500,t,.1);
 E.road.g.gain.setTargetAtTime(on*sp*.05,t,.1);
 E.master.gain.setTargetAtTime(E.mute?0:.9,t,.12)}
function engineHit(D,power){const E=D.eng;if(!E||E.mute||E.ac.state==="closed")return;const ac=E.ac,now=Date.now();if(now-E.hitT<260)return;E.hitT=now;power=Math.max(.15,Math.min(1,power));
 try{const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(36,t+.3);g.gain.setValueAtTime(.4*power,t);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.34);

async function bzBuy(g){if(g.sf===S.fid)return"That is your own listing.";if(!S.inf.coins&&S.coins<g.price)return"You need 🪙 "+fmtCoins(g.price)+" for that.";
 try{let cur=await bzReq("GET","/"+g.id);if(!bzOk(cur)||cur.sold)return"Someone already bought it.";
  await bzReq("PUT","/"+g.id+"/bids/"+S.fid,{ts:{".sv":"timestamp"},n:myName()});await bzWait(1100);
  cur=await bzReq("GET","/"+g.id);if(!bzOk(cur))return"The seller took it back.";
  const bids=Object.entries(cur.bids||{}).map(([k,v])=>[k,+(v&&v.ts)||0]).sort((a,b)=>a[1]-b[1]||(a[0]<b[0]?-1:1));
  if(cur.sold||!bids.length||bids[0][0]!==S.fid){try{await bzReq("DELETE","/"+g.id+"/bids/"+S.fid)}catch(e){}return"Someone else got it first!"}
  await bzReq("PATCH","/"+g.id,{sold:true,buyer:myName(),bf:S.fid,sts:{".sv":"timestamp"}});
  if(!S.inf.coins)S.coins-=g.price;give(g.car,1);bzSrc(g.car);save();upd();return""}catch(e){return"Couldn’t reach the Bazaar. Your coins were not taken."}}
async function bzCancel(g){try{const cur=await bzReq("GET","/"+g.id);if(!bzOk(cur))return"That listing is already gone.";if(cur.sold)return"It just sold! Collect your coins.";await bzReq("DELETE","/"+g.id);give(g.car,1);bzSrc(g.car);save();upd();return""}catch(e){return"Couldn’t reach the Bazaar. Try again."}}

 el.querySelectorAll("[data-rx]").forEach(b=>b.onclick=async()=>{try{await DB.doc("rassign/"+b.dataset.rx).delete();delete RASSIGN[b.dataset.rx];rolesCard()}catch(e){alert("Couldn’t take it away.")}});
 if(!RPRF&&DB){RPRF=true;DB.collection("presence").get().then(s=>{RPR=s.docs.map(d=>d.data()).filter(p=>p&&p.uid);if(view==="admin"&&$("rlc"))rolesCard()}).catch(()=>{})}}
